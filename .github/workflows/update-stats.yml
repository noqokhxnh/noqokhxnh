name: 🌱 Daily Contributions & Keep Streak

on:
  schedule:
    - cron: '0 0 * * *'     # 0h UTC (07:00 AM VN) mỗi ngày
  workflow_dispatch:         # chạy tay nếu muốn
    inputs:
      preview_only:
        description: 'Chỉ in bản đồ preview ra log (không commit)'
        type: boolean
        default: false
      style:
        description: 'Font chữ (UPPERCASE hoặc LOWERCASE)'
        type: choice
        options:
          - UPPERCASE
          - LOWERCASE
        default: UPPERCASE
      force:
        description: 'Bỏ qua kiểm tra trùng lặp commit hôm nay'
        type: boolean
        default: false

jobs:
  daily-contributions:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # để push commit

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Preview Contribution Graph
        if: ${{ inputs.preview_only == true }}
        run: |
          python3 .github/scripts/daily_contributions.py --preview --style "${{ inputs.style || 'UPPERCASE' }}"

      - name: Create assets directory
        if: ${{ inputs.preview_only != true }}
        run: mkdir -p assets

      - name: Generate Daily Contributions & Commit
        if: ${{ inputs.preview_only != true }}
        run: |
          git config user.name "noqokhxnh"
          git config user.email "khanh2k5xxx@gmail.com"

          STYLE="${{ inputs.style || 'UPPERCASE' }}"
          FORCE_FLAG=""
          if [ "${{ inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi

          python3 .github/scripts/daily_contributions.py --run --style "$STYLE" $FORCE_FLAG

      - name: Push changes
        if: ${{ inputs.preview_only != true }}
        run: |
          git pull --rebase origin main || true
          git push origin main
