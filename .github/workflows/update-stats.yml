name: 📊 Update GitHub Stats

on:
  schedule:
    - cron: '0 0 * * *'     # 0h UTC mỗi ngày
  workflow_dispatch:         # chạy tay nếu muốn

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # để push commit

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5   # tránh warning Node.js 20

      - name: Create assets directory
        run: mkdir -p assets

      - name: Download GitHub Stats
        run: |
          curl --fail -s -o assets/stats.svg \
            "https://gh-readme-stats-psi.vercel.app/api?username=noqokhxnh&theme=tokyonight&show_icons=true&hide_border=true&count_private=true"

      - name: Download Top Languages
        run: |
          curl --fail -s -o assets/top-langs.svg \
            "https://gh-readme-stats-psi.vercel.app/api/top-langs?username=noqokhxnh&theme=tokyonight&hide_border=true&layout=compact"

      - name: Download Streak Stats
        run: |
          curl --fail -s -o assets/streak.svg \
            "https://github-readme-streak-stats-eight.vercel.app?user=noqokhxnh&theme=tokyonight&hide_border=true&background=0D1117&ring=4682B4&fire=4682B4&currStreakLabel=4682B4"

      - name: Download Activity Graph
        run: |
          curl --fail -s -o assets/activity.svg \
            "https://github-readme-activity-graph.vercel.app/graph?username=noqokhxnh&theme=react-dark&hide_border=true&bg_color=0d1117&color=4682B4&line=4682B4&point=FFFFFF&area=true"

      - name: Commit and push if changed
        run: |
          git config user.name "noqokhxnh"
          git config user.email "khanh2k5xxx@gmail.com"
          git add assets/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "📈 Update GitHub stats [skip ci]"
            git push
          fi
